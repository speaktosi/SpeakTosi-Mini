name: 🐛 Bug Report / 错误报告
description: 创建一个错误报告，帮助我们改进 SpeakTosi-Mini
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您反馈问题！请填写以下信息以便我们更快定位。
  - type: textarea
    id: phenomenon
    attributes:
      label: 问题现象
      description: 请详细描述遇到了什么错误或异常。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请提供复现该问题的具体步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 正常情况下应该发生什么？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 实际发生了什么？
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: 硬件配置
      description: 显卡型号、显存大小、系统内存大小等。
      placeholder: "如：RTX 4090 (24GB VRAM), 32GB RAM"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志与错误信息
      description: 请提供 app/backend/logs 与 日志/ 目录下的相关日志内容。
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: 软件版本
      description: 当前使用的 SpeakTosi 版本。
    validations:
      required: true
  - type: dropdown
    id: setup_bat
    attributes:
      label: 是否已运行 SETUP.bat
      description: 您在首次运行前是否已经成功跑过一次 SETUP.bat？
      options:
        - "是"
        - "否"
    validations:
      required: true