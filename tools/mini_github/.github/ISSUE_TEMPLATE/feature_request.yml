name: 💡 Feature Request
description: Propose a new feature for SpeakTosi Mini
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your suggestion! Please describe the feature you'd like to add in detail.
  - type: textarea
    id: scenario
    attributes:
      label: Use Case Scenario
      description: What problem did you encounter or in what scenario do you need this feature?
    validations:
      required: true
  - type: textarea
    id: expected_solution
    attributes:
      label: Expected Solution
      description: How do you expect us to implement this feature?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: Are there any alternative implementation solutions?
    validations:
      required: false
  - type: dropdown
    id: willing_to_pr
    attributes:
      label: Willing to submit a PR
      description: Are you willing to contribute code and submit a Pull Request for this feature?
      options:
        - "Yes, I am willing to submit a PR!"
        - "No, I hope the developers implement it."
    validations:
      required: true
