name: 🐛 Bug Report
description: Create a bug report to help us improve SpeakTosi Mini
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please fill out the information below to help us locate the problem faster.
  - type: textarea
    id: phenomenon
    attributes:
      label: Issue Phenomenon
      description: Please describe the error or exception in detail.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Please provide the exact steps to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Result
      description: What should happen under normal circumstances?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Result
      description: What actually happened?
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware Configuration
      description: Graphics card model, VRAM size, system RAM size, etc.
      placeholder: "e.g., RTX 4090 (24GB VRAM), 32GB RAM"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and Error Messages
      description: Please provide the relevant log contents from app/backend/logs and 日志/ directories.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Software Version
      description: The current SpeakTosi version you are using.
    validations:
      required: true
  - type: dropdown
    id: setup_bat
    attributes:
      label: Have you run SETUP.bat?
      description: Have you successfully run SETUP.bat once before your first launch?
      options:
        - "Yes"
        - "No"
    validations:
      required: true
