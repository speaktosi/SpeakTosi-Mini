<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>桌面老师 · SpeakTosi</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:transparent; width:100%; height:100%; user-select:none; }
  #stage { position:absolute; inset:0; }
  /* 1004 B路线真透明: 卡片化外观(边框/阴影/圆角/黑底)全部移除, wrap 只作交互层 */
  #wrap { position:absolute; inset:0; cursor:pointer; overflow:hidden;
          transition:opacity .25s; }
  #ck { display:block; width:100%; height:100%; pointer-events:none; }
  /* video 退居幕后(WebGL 纹理源), 不再直接显示 */
  #vid { position:absolute; left:-4px; top:-4px; width:2px; height:2px; opacity:0.02; pointer-events:none; }
  #aud { display:none; }

  /* ===== 右上角按钮组：纵向从上至下（麦克风→记录→打断→设置） 赛博霓虹风 ===== */
  #topBtns { position:absolute; top:10px; right:10px; display:flex; flex-direction:column; gap:8px; z-index:20; }
  /* 记录面板滑出时，按钮列整体左移让位，保持可见可点 */
  body:has(#histPanel.open) #topBtns { right:calc(min(420px, 92%) + 16px); }

  /* 赛博朋克麦克风 */
  #mic { position:relative; width:46px; height:46px; border:0; cursor:pointer; padding:0;
         background:linear-gradient(145deg,#0d1b2a 0%,#1b263b 55%,#0d1b2a 100%);
         clip-path:polygon(12% 0,100% 0,100% 88%,88% 100%,0 100%,0 12%);
         box-shadow:0 0 12px rgba(0,240,255,.35), inset 0 0 8px rgba(0,240,255,.12);
         color:#00f0ff; font-size:19px; line-height:46px; text-align:center;
         transition:box-shadow .2s, color .2s; overflow:hidden; }
  #mic:before { content:""; position:absolute; inset:0; pointer-events:none;
                background:repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,240,255,.05) 2px 3px); }
  #mic:after { content:""; position:absolute; left:0; right:0; height:34%; pointer-events:none;
               background:linear-gradient(180deg, transparent, rgba(0,240,255,.14), transparent);
               animation:scan 2.6s linear infinite; }
  @keyframes scan { 0%{top:-40%} 100%{top:110%} }
  #mic:hover { box-shadow:0 0 20px rgba(0,240,255,.7), inset 0 0 12px rgba(0,240,255,.25); }
  #mic.rec { color:#fff; animation:pulse 1s ease-in-out infinite;
             background:linear-gradient(145deg,#2a0d14 0%,#3b1b26 55%,#2a0d14 100%);
             box-shadow:0 0 18px rgba(255,45,85,.8), inset 0 0 10px rgba(255,45,85,.3); }
  @keyframes pulse { 0%,100%{box-shadow:0 0 12px rgba(255,45,85,.6), inset 0 0 8px rgba(255,45,85,.25)}
                     50%{box-shadow:0 0 26px rgba(255,45,85,1), inset 0 0 14px rgba(255,45,85,.45)} }

  /* 会话记录按钮（同族赛博风，洋红霓虹） */
  #histBtn { position:relative; width:46px; height:46px; border:0; cursor:pointer; padding:0;
             background:linear-gradient(145deg,#1a0d2a 0%,#26133b 55%,#1a0d2a 100%);
             clip-path:polygon(12% 0,100% 0,100% 88%,88% 100%,0 100%,0 12%);
             box-shadow:0 0 12px rgba(255,0,200,.3), inset 0 0 8px rgba(255,0,200,.1);
             color:#ff4fd8; font-size:18px; line-height:46px; text-align:center;
             transition:box-shadow .2s; overflow:hidden; }
  #histBtn:before { content:""; position:absolute; inset:0; pointer-events:none;
                    background:repeating-linear-gradient(0deg, transparent 0 2px, rgba(255,0,200,.05) 2px 3px); }
  #histBtn:hover { box-shadow:0 0 20px rgba(255,0,200,.65), inset 0 0 12px rgba(255,0,200,.22); }

  /* 打断按钮：待机暗红，老师说话时红色霓虹脉冲（一眼可见此刻可打断） */
  #intrBtn { position:relative; width:46px; height:46px; border:0; cursor:pointer; padding:0;
             background:linear-gradient(145deg,#1c0f12 0%,#2a1519 55%,#1c0f12 100%);
             clip-path:polygon(12% 0,100% 0,100% 88%,88% 100%,0 100%,0 12%);
             box-shadow:0 0 8px rgba(255,60,60,.18), inset 0 0 6px rgba(255,60,60,.08);
             color:#8a5a5e; font-size:17px; line-height:46px; text-align:center;
             transition:color .25s, box-shadow .25s; overflow:hidden; }
  #intrBtn:before { content:""; position:absolute; inset:0; pointer-events:none;
                    background:repeating-linear-gradient(0deg, transparent 0 2px, rgba(255,60,60,.04) 2px 3px); }
  #intrBtn.armed { color:#ff3c4e; animation:intrpulse .9s ease-in-out infinite; }
  #intrBtn.armed:hover { box-shadow:0 0 24px rgba(255,60,78,.95), inset 0 0 12px rgba(255,60,78,.4); }
  @keyframes intrpulse { 0%,100%{box-shadow:0 0 8px rgba(255,60,78,.35), inset 0 0 6px rgba(255,60,78,.15)}
                         50%{box-shadow:0 0 20px rgba(255,60,78,.85), inset 0 0 10px rgba(255,60,78,.3)} }

  /* 设置按钮：暗金族（与整合包品牌同色），悬停齿轮缓转 —— 炫酷但克制 */
  #setBtn { position:relative; width:46px; height:46px; border:0; cursor:pointer; padding:0;
            background:linear-gradient(145deg,#171208 0%,#241c0d 55%,#171208 100%);
            clip-path:polygon(12% 0,100% 0,100% 88%,88% 100%,0 100%,0 12%);
            box-shadow:0 0 10px rgba(212,175,55,.22), inset 0 0 7px rgba(212,175,55,.10);
            color:#d4af37; font-size:19px; line-height:46px; text-align:center;
            transition:box-shadow .2s; overflow:hidden; }
  #setBtn:before { content:""; position:absolute; inset:0; pointer-events:none;
                   background:repeating-linear-gradient(0deg, transparent 0 2px, rgba(212,175,55,.05) 2px 3px); }
  #setBtn span { display:inline-block; transition:transform .5s cubic-bezier(.3,.7,.3,1); }
  #setBtn:hover { box-shadow:0 0 18px rgba(212,175,55,.6), inset 0 0 11px rgba(212,175,55,.22); }
  #setBtn:hover span { transform:rotate(90deg); }
  #setBtn:active span { transform:rotate(90deg) scale(.86); }

  /* ===== 底部影视字幕（1007r3重构：老师内容=单背景块内容流自动折行保留最新2-3行；学生=独立气泡即说即清） ===== */
  #subs { position:absolute; left:50%; transform:translateX(-50%); bottom:14px;
          width:93%; max-width:93%; z-index:15; pointer-events:none;
          display:flex; flex-direction:column; gap:4px; align-items:center; }
  #subFlow { width:100%; box-sizing:border-box; background:rgba(8,10,16,.78); border:1px solid rgba(212,175,55,.28);
             border-radius:8px; padding:5px 14px; color:#f5efdf; text-align:center;
             font:14px/1.45 "Segoe UI","Microsoft YaHei",sans-serif; text-shadow:0 1px 2px #000;
             white-space:normal; overflow-wrap:anywhere; word-break:normal; display:none;
             max-height:calc(1.45em * 3 + 12px); overflow:hidden; }   /* 1007r3: 硬顶3行高，超出部分由JS scrollTop尾部跟随 */
  #subMine { max-width:100%; box-sizing:border-box; background:rgba(8,10,16,.78); border:1px solid rgba(0,240,255,.4);
             border-radius:8px; padding:5px 14px; color:#c9f6ff; text-align:center;
             font:14px/1.4 "Segoe UI","Microsoft YaHei",sans-serif; text-shadow:0 1px 2px #000;
             white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:none;
             animation:subin .28s ease-out; }
  @keyframes subin { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }

  /* ===== 会话记录面板（右侧滑出，赛博暗色） ===== */
  #histPanel { position:absolute; top:0; right:0; bottom:0; width:min(420px, 92%); z-index:30;
               background:linear-gradient(160deg, rgba(10,14,24,.97), rgba(16,10,28,.97));
               border-left:1px solid rgba(0,240,255,.35); box-shadow:-8px 0 30px rgba(0,0,0,.6);
               transform:translateX(105%); transition:transform .28s ease; display:flex; flex-direction:column; }
  #histPanel.open { transform:none; }
  #histHead { padding:14px 16px 10px; border-bottom:1px solid rgba(0,240,255,.2);
              display:flex; align-items:center; gap:10px; flex:none; }
  #histHead .t { flex:1; color:#00f0ff; font:600 16px "Segoe UI","Microsoft YaHei",sans-serif;
                 text-shadow:0 0 8px rgba(0,240,255,.5); letter-spacing:1px; }
  #histClose { background:none; border:1px solid rgba(255,0,200,.5); color:#ff4fd8; width:30px; height:30px;
               border-radius:6px; cursor:pointer; font-size:14px; }
  #histClear { background:none; border:1px solid rgba(0,240,255,.35); color:#7ce7f5; height:30px; padding:0 10px;
               border-radius:6px; cursor:pointer; font-size:12px; }
  #histList { flex:1; overflow-y:auto; padding:12px 14px; }
  #histList::-webkit-scrollbar { width:5px; }
  #histList::-webkit-scrollbar-thumb { background:rgba(0,240,255,.35); border-radius:3px; }
  .hitem { margin-bottom:12px; padding:9px 12px; border-radius:9px; font:13.5px/1.55 "Segoe UI","Microsoft YaHei",sans-serif; }
  .hitem .who { font-size:11px; letter-spacing:1px; margin-bottom:4px; opacity:.85; }
  .hitem.user { background:rgba(0,240,255,.07); border:1px solid rgba(0,240,255,.25); color:#c9f6ff; }
  .hitem.user .who { color:#00f0ff; }
  .hitem.assistant { background:rgba(255,0,200,.05); border:1px solid rgba(255,0,200,.2); color:#f0e6f6; }
  .hitem.assistant .who { color:#ff4fd8; }
  .hitem .ts { float:right; font-size:10px; opacity:.5; }
  .hitem mark { background:linear-gradient(120deg, rgba(255,215,0,.3), rgba(255,140,0,.35));
                color:#ffe9a8; border-radius:4px; padding:0 3px; font-weight:600;
                box-shadow:0 0 6px rgba(255,200,0,.25); }
  .hitem .vocab { margin-top:6px; padding-top:6px; border-top:1px dashed rgba(255,255,255,.14);
                  font-size:11px; color:#ffd97a; }
  #histEmpty { color:#7c8aa0; text-align:center; margin-top:40px; font-size:13px; }

  /* ===== 1019 声音回放按钮 ===== */
  .hitem .audiobtn { margin-top:7px; margin-left:6px; background:none; border:1px solid rgba(212,175,55,.45);
                     color:#e8c66a; height:22px; padding:0 8px; border-radius:6px; cursor:pointer; font-size:11px;
                     font-family:"Segoe UI","Microsoft YaHei",sans-serif; opacity:.85; }
  .hitem .audiobtn:hover { color:#ffd97a; border-color:rgba(212,175,55,.85); opacity:1; }
  .hitem .audiobtn:active { transform:scale(.97); }
  .hitem .copybtn { margin-top:7px; margin-right:6px; background:none; border:1px solid rgba(120,255,200,.38);
                  color:#8ff5c8; height:22px; padding:0 8px; border-radius:6px; cursor:pointer; font-size:11px;
                  font-family:"Segoe UI","Microsoft YaHei",sans-serif; opacity:.85; }
  .hitem .copybtn:hover { color:#5cffc0; border-color:rgba(120,255,200,.8); opacity:1; }
  .hitem .copybtn:active { transform:scale(.97); }
  .hitem .trbtn { margin-top:7px; background:none; border:1px solid rgba(0,240,255,.35); color:#7ce7f5;
                  height:22px; padding:0 8px; border-radius:6px; cursor:pointer; font-size:11px;
                  font-family:"Segoe UI","Microsoft YaHei",sans-serif; opacity:.85; }
  .hitem .trbtn:hover { color:#00f0ff; border-color:rgba(0,240,255,.7); opacity:1; }
  .hitem .trbtn[disabled] { opacity:.5; cursor:default; }
  .hitem .htr { margin-top:7px; padding-top:6px; border-top:1px dashed rgba(0,240,255,.28);
                font-size:12.5px; line-height:1.55; color:#bff5ff; }
  .hitem .htr::before { content:"🌐 译文 "; font-size:10.5px; color:#7ce7f5; opacity:.8; }

  /* 会话评测 / eval tabs */
  #histTabs { display:flex; gap:6px; padding:8px 14px 0; flex:none; }
  #histTabs .tab { flex:1; background:none; border:1px solid rgba(0,240,255,.25); color:#7c8aa0;
                   height:30px; border-radius:7px 7px 0 0; cursor:pointer; font-size:12.5px;
                   font-family:"Segoe UI","Microsoft YaHei",sans-serif; }
  #histTabs .tab.on { color:#00f0ff; border-color:rgba(0,240,255,.6); background:rgba(0,240,255,.08);
                      text-shadow:0 0 8px rgba(0,240,255,.5); }
  #evalWrap { flex:1; display:flex; flex-direction:column; min-height:0; }
  #evalList { flex:1; overflow-y:auto; padding:10px 14px; }
  #evalList::-webkit-scrollbar { width:5px; }
  #evalList::-webkit-scrollbar-thumb { background:rgba(0,240,255,.35); border-radius:3px; }
  .eitem { margin-bottom:10px; padding:10px 12px; border-radius:9px; cursor:pointer;
           background:rgba(212,175,55,.06); border:1px solid rgba(212,175,55,.3);
           color:#f0e6d6; font:13px/1.5 "Segoe UI","Microsoft YaHei",sans-serif; }
  .eitem:hover { border-color:rgba(212,175,55,.7); }
  .eitem .et { font-size:11.5px; letter-spacing:.5px; color:#d4af37; margin-bottom:3px; }
  .eitem .es { opacity:.8; font-size:11.5px; }
  .eitem.open .es { color:#7ce7f5; }
  .eitem .badge { float:right; font-size:10.5px; padding:1px 7px; border-radius:8px; }
  .badge.done { background:rgba(0,255,150,.12); color:#5dffc0; border:1px solid rgba(0,255,150,.4); }
  .badge.running { background:rgba(0,200,255,.1); color:#7ce7f5; border:1px solid rgba(0,200,255,.35); }
  .badge.error { background:rgba(255,80,80,.12); color:#ff9a9a; border:1px solid rgba(255,80,80,.4); }
  .badge.skip { background:rgba(140,140,140,.12); color:#9aa; border:1px solid rgba(140,140,140,.35); }
  .badge.open { background:rgba(0,240,255,.08); color:#00f0ff; border:1px solid rgba(0,240,255,.3); }
  #evalDetail { flex:1; overflow-y:auto; padding:12px 14px; min-height:0;
                font:13px/1.65 "Segoe UI","Microsoft YaHei",sans-serif; color:#e8e2d4; }
  #evalDetail::-webkit-scrollbar { width:5px; }
  #evalDetail::-webkit-scrollbar-thumb { background:rgba(212,175,55,.4); border-radius:3px; }
  #evalDetail h1,#evalDetail h2,#evalDetail h3 { color:#d4af37; margin:14px 0 6px; font-size:15px; }
  #evalDetail blockquote { border-left:3px solid rgba(212,175,55,.6); margin:8px 0; padding:4px 10px;
                           color:#cfc5a8; background:rgba(212,175,55,.05); }
  #evalDetail code { background:rgba(0,240,255,.08); color:#7ce7f5; padding:1px 5px; border-radius:4px; }
  #evalDetail b, #evalDetail strong { color:#ffd97a; }
  #evalDetail hr { border:0; border-top:1px dashed rgba(212,175,55,.3); margin:12px 0; }
  #evalDetail ul,#evalDetail ol { padding-left:20px; }
  #edBar { display:flex; gap:8px; padding:8px 14px; border-top:1px solid rgba(212,175,55,.25); flex:none; }
  #edBar button { background:none; border:1px solid rgba(212,175,55,.5); color:#d4af37;
                  height:30px; padding:0 12px; border-radius:6px; cursor:pointer; font-size:12px; }
  #edBar button.danger { border-color:rgba(255,80,80,.5); color:#ff9a9a; }
  #edBar .sp { flex:1; }
  #histBtn.hasEval::after { content:''; position:absolute; top:4px; right:4px; width:9px; height:9px;
                            border-radius:50%; background:#ff3860; box-shadow:0 0 8px #ff3860; }
  #histBtn { position:relative; }

  /* 输入条 */
  #bar { position:absolute; left:6px; right:6px; bottom:6px; display:none; gap:6px; z-index:25; }
  /* ===== 1006v3 语音发送确认条（confirm 模式：松手后 ✓发送 / ✗取消，文本可改） ===== */
  #confirmBar { position:absolute; left:8px; right:8px; bottom:8px; display:none; flex-direction:column; gap:6px;
                z-index:26; background:rgba(10,14,24,.94); border:1px solid rgba(0,240,255,.45);
                border-radius:10px; padding:9px 10px; box-shadow:0 0 18px rgba(0,240,255,.25), 0 4px 18px rgba(0,0,0,.5); }
  #cfmTitle { color:#00f0ff; font:12px "Segoe UI","Microsoft YaHei",sans-serif; letter-spacing:.5px;
              text-shadow:0 0 6px rgba(0,240,255,.5); }
  #cfmTxt { width:100%; box-sizing:border-box; resize:none; background:rgba(16,20,30,.95);
            border:1px solid rgba(212,175,55,.4); border-radius:8px; color:#f5efdf;
            padding:7px 9px; font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif; outline:none; }
  #cfmTxt:focus { border-color:rgba(0,240,255,.6); }
  #cfmBtns { display:flex; gap:8px; }
  #cfmSend { flex:1; background:linear-gradient(135deg,#1fae6a,#0c7a45); color:#eafff4; border:0; border-radius:8px;
             padding:8px 0; font:600 14px "Segoe UI","Microsoft YaHei",sans-serif; cursor:pointer;
             box-shadow:0 0 10px rgba(0,255,150,.25); }
  #cfmSend:hover { box-shadow:0 0 18px rgba(0,255,150,.55); }
  #cfmCancel { flex:1; background:linear-gradient(135deg,#b3323f,#7a1f28); color:#ffeef0; border:0; border-radius:8px;
               padding:8px 0; font:600 14px "Segoe UI","Microsoft YaHei",sans-serif; cursor:pointer;
               box-shadow:0 0 10px rgba(255,60,80,.25); }
  #cfmCancel:hover { box-shadow:0 0 18px rgba(255,60,80,.55); }
  #txt { flex:1; min-width:0; background:rgba(16,20,30,.9); border:1px solid rgba(212,175,55,.4);
         border-radius:9px; color:#f5efdf; padding:9px 11px; font-size:14px; outline:none; }
  #txt::placeholder { color:#7c7460; }
  .btn { background:linear-gradient(135deg,#d4af37,#8a6d1f); color:#0a0c12; border:0; border-radius:9px;
         padding:0 13px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .btn.ghost { background:rgba(255,255,255,.1); color:#d8cfb4; border:1px solid rgba(212,175,55,.32); }
  #tip { position:absolute; right:10px; bottom:14px; z-index:9; padding:5px 10px; background:rgba(16,18,24,.82);
         color:#d4af37; border-radius:8px; font:12px "Microsoft YaHei",sans-serif; pointer-events:none;
         opacity:0; transition:opacity .4s; }
  #status { position:absolute; top:12px; left:12px; font:11px "Segoe UI",sans-serif; color:#9aa4b8;
            z-index:6; pointer-events:none; text-shadow:0 1px 3px #000; }
  #status .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:#e05555;
                 margin-right:5px; vertical-align:1px; }
  #status.on .dot { background:#3ddc84; }
  /* 1018: 引擎冷启动(模型加载1~2分钟)期间用琥珀色"准备中", 不再误报红色"连接失败" */
  #status.wait .dot { background:#e8b23a; }

  /* ===== 1012 视觉老师: 📷按钮(翡翠霓虹, 同族赛博风) + 取景弹窗 ===== */
  #camBtn { position:relative; width:46px; height:46px; border:0; cursor:pointer; padding:0;
            background:linear-gradient(145deg,#0d2a1b 0%,#1b3b26 55%,#0d2a1b 100%);
            clip-path:polygon(12% 0,100% 0,100% 88%,88% 100%,0 100%,0 12%);
            box-shadow:0 0 12px rgba(61,220,132,.35), inset 0 0 8px rgba(61,220,132,.12);
            color:#3ddc84; font-size:19px; line-height:46px; text-align:center;
            transition:box-shadow .2s; }
  #camBtn:hover { box-shadow:0 0 20px rgba(61,220,132,.7), inset 0 0 12px rgba(61,220,132,.25); }
  #camModal { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:40;
              display:none; flex-direction:column; gap:8px; width:min(340px, 92%);
              background:rgba(10,12,18,.96); border:1px solid rgba(61,220,132,.45); border-radius:10px;
              padding:10px; box-shadow:0 0 30px rgba(0,0,0,.7); }
  #camHead { display:flex; align-items:center; gap:6px; color:#3ddc84; font:12px 'Microsoft YaHei',sans-serif; }
  #camHead select { flex:1; min-width:0; background:#151a24; color:#cfd8e3; border:1px solid #333;
              border-radius:5px; height:24px; font-size:11px; }
  #camHead button { background:none; border:0; color:#8a8a8a; cursor:pointer; font-size:14px; }
  #camVid { width:100%; aspect-ratio:16/9; background:#000; border-radius:8px; object-fit:cover; }
  #camBtns { display:flex; align-items:center; gap:8px; }
  #camSnap { flex:none; width:44px; height:34px; border:0; border-radius:8px; cursor:pointer;
             background:linear-gradient(145deg,#3ddc84,#1f8a4f); color:#04120a; font-size:16px; }
  #camHint { color:#8aa0a8; font:11px 'Microsoft YaHei',sans-serif; }
  #camRev { display:none; flex-direction:column; gap:6px; }
  #camThumb { width:100%; border-radius:8px; border:1px solid rgba(61,220,132,.3); }
  #camTxt { background:#151a24; color:#e8e8e8; border:1px solid #444; border-radius:6px;
            padding:7px 9px; font:13px 'Microsoft YaHei',sans-serif; outline:none; }
  #camDo { display:flex; gap:8px; }
  #camSend { flex:1; height:30px; border:0; border-radius:6px; cursor:pointer; font-size:12px;
             background:linear-gradient(145deg,#3ddc84,#1f8a4f); color:#04120a; }
  #camCancel { flex:1; height:30px; background:none; border:1px solid rgba(255,80,80,.5);
             border-radius:6px; color:#ff9a9a; cursor:pointer; font-size:12px; }

  /* 1020: 历史面板展开时自动收窄，避免字幕压住功能面板 */
  body:has(#histPanel.open) #subs { width:70%; max-width:70%; }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap"><canvas id="ck"></canvas><video id="vid" autoplay playsinline muted></video></div>
  <audio id="aud" autoplay></audio>
  <div id="status"><span class="dot"></span><span id="stxt">连接中…</span></div>

  <div id="topBtns">
    <button id="mic" title="按住说话">🎙</button>
    <button id="camBtn" title="拍照问老师（摄像头看图）">📷</button>
    <button id="histBtn" title="会话记录">🗎</button>
    <button id="intrBtn" title="打断老师说话">⏹</button>
    <button id="setBtn" title="设置"><span>⚙</span></button>
  </div>

  <!-- 1012 视觉老师: 取景 → 快门(立即释放摄像头) → 预览确认 → 发送 -->
  <div id="camModal">
    <div id="camHead">
      <span>📷 拍照问老师</span>
      <select id="camSel" title="选择摄像头"></select>
      <button id="camClose" title="关闭">✕</button>
    </div>
    <video id="camVid" autoplay playsinline muted></video>
    <div id="camBtns"><button id="camSnap" title="拍照">📸</button><span id="camHint">把要问的东西放进画面，按 📸 拍照</span></div>
    <div id="camRev">
      <img id="camThumb" alt="preview">
      <input id="camTxt" placeholder="想问什么？例：这个用英语怎么说？（留空=请老师描述）">
      <div id="camDo"><button id="camSend">✓ 发给老师</button><button id="camCancel">✗ 重拍</button></div>
    </div>
  </div>

  <div id="subs">
    <div id="subFlow"></div>
    <div id="subMine"></div>
  </div>

  <div id="histPanel">
    <div id="histHead">
      <span class="t">◢ 会话记录 SESSION LOG</span>
      <button id="histTrAll" title="把最近20条一键翻译（英↔中自动判别）" style="background:none;border:1px solid rgba(0,240,255,.5);color:#7ce7f5;height:30px;padding:0 10px;border-radius:6px;cursor:pointer;font-size:12px;">译全部</button>
      <button id="histExport" title="导出复习笔记(Markdown)" style="background:none;border:1px solid rgba(212,175,55,.5);color:#d4af37;height:30px;padding:0 10px;border-radius:6px;cursor:pointer;font-size:12px;">导出笔记</button>
      <button id="histClear" title="清空记录">清空</button>
      <span id="histHint" style="font-size:11px;color:#8a8;align-self:center;"></span>
      <button id="histClose" title="关闭">✕</button>
    </div>
    <div id="histTabs">
      <button class="tab on" id="tabLog">💬 对话记录 Log</button>
      <button class="tab" id="tabEval">📋 会话评测 Review</button>
    </div>
    <div id="histList"><div id="histEmpty">还没有对话记录<br>跟 SpeakTosi 说点什么吧</div></div>
    <div id="evalWrap" style="display:none">
      <div id="evalList"></div>
      <div id="evalDetail" style="display:none"></div>
    </div>
  </div>

  <div id="bar">
    <input id="txt" placeholder="问 SpeakTosi …（Enter 发送）">
    <button class="btn" id="send">发送</button>
    <button class="btn ghost" id="closeSess" title="结束本次会话并关闭老师窗口（自动进入会话评测）">关闭</button>
  </div>
  <!-- 1006v3 语音发送确认条: confirm 模式下松手后显示, 文本可编辑, ✓发送/✗取消 -->
  <div id="confirmBar">
    <div id="cfmTitle">🎙 识别结果 · 确认发送（可直接修改文字）</div>
    <textarea id="cfmTxt" rows="2" spellcheck="false"></textarea>
    <div id="cfmBtns">
      <button id="cfmSend" title="发送这句话（Enter）">✓ 发送</button>
      <button id="cfmCancel" title="取消，不发送（Esc）">✗ 取消</button>
    </div>
  </div>
    <div id="tip"></div>
</div>
<script src="overlay.js"></script>
</body>
</html>
